<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Developer CLI Commands Reference</title>

    <style>
      :root {
        /* =========================================
         COLORS
      ========================================= */

        --color-primary: #6366f1;
        --color-primary-hover: #4f46e5;
        --color-primary-light: #eef2ff;

        --color-bg: #f8fafc;
        --color-surface: #ffffff;
        --color-surface-alt: #f1f5f9;

        --color-text: #1e293b;
        --color-text-muted: #64748b;
        --color-border: #e2e8f0;

        --color-success: #16a34a;
        --color-success-light: #dcfce7;

        --color-warning: #d97706;
        --color-warning-light: #fef3c7;

        --color-danger: #dc2626;
        --color-danger-light: #fee2e2;

        --color-info: #0284c7;

        --color-code-bg: #0f172a;
        --color-code-text: #e2e8f0;

        /* =========================================
         TYPOGRAPHY
      ========================================= */

        --font-sans:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;

        --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;

        --font-size-xs: 0.75rem;
        --font-size-sm: 0.875rem;
        --font-size-base: 1rem;
        --font-size-lg: 1.125rem;
        --font-size-xl: 1.25rem;
        --font-size-2xl: 1.5rem;
        --font-size-3xl: 1.875rem;

        /* =========================================
         SPACING
      ========================================= */

        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-5: 1.25rem;
        --space-6: 1.5rem;
        --space-8: 2rem;
        --space-10: 2.5rem;

        /* =========================================
         LAYOUT
      ========================================= */

        --sidebar-width: 270px;
        --content-max-width: 1200px;
        --floating-panel-width: 260px;

        /* =========================================
         UI
      ========================================= */

        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 16px;

        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);

        --transition: 0.2s ease;
      }

      /* =========================================
       RESET
    ========================================= */

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: var(--font-sans);
        font-size: var(--font-size-base);
        line-height: 1.6;
        color: var(--color-text);
        background: var(--color-bg);
      }

      /* =========================================
       LAYOUT
    ========================================= */

      .app {
        min-height: 100vh;
      }

      .left-panel {
        position: fixed;
        top: 0;
        left: 0;

        width: var(--sidebar-width);
        height: 100vh;

        padding: var(--space-6);

        overflow-y: auto;

        background: var(--color-surface);
        border-right: 1px solid var(--color-border);
      }

      .main {
        margin-left: var(--sidebar-width);
        padding: var(--space-8);
      }

      .content {
        width: 100%;
        max-width: var(--content-max-width);

        margin: 0 auto;

        padding-right: calc(var(--floating-panel-width) + var(--space-8));
      }

      .floating-panel {
        position: fixed;

        top: var(--space-8);
        right: var(--space-8);

        width: var(--floating-panel-width);

        padding: var(--space-5);

        background: var(--color-surface);

        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);

        box-shadow: var(--shadow-md);
      }

      /* =========================================
       HEADINGS
    ========================================= */

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        margin-top: 0;
        margin-bottom: var(--space-4);

        line-height: 1.25;
        color: var(--color-text);
      }

      h1 {
        font-size: var(--font-size-3xl);
      }

      h2 {
        font-size: var(--font-size-2xl);
        padding-top: var(--space-4);
      }

      h3 {
        font-size: var(--font-size-xl);
      }

      h4 {
        font-size: var(--font-size-lg);
      }

      p {
        margin: 0 0 var(--space-4);
      }

      /* =========================================
       DIVIDERS
    ========================================= */

      .divider {
        width: 100%;
        height: 1px;

        margin: var(--space-8) 0;

        border: 0;

        background: var(--color-border);
      }

      .divider--primary {
        background: var(--color-primary);
      }

      /* =========================================
       LEFT NAVIGATION
    ========================================= */

      .nav-group {
        margin-bottom: var(--space-5);
      }

      .nav-group__label {
        display: block;

        margin-bottom: var(--space-2);

        font-size: var(--font-size-sm);
        font-weight: 800;

        color: var(--color-primary);
      }

      .nav-links {
        display: flex;
        flex-direction: column;
        gap: var(--space-1);

        padding-left: var(--space-4);
      }

      .nav-link {
        display: block;

        padding: var(--space-2) var(--space-3);

        border-radius: var(--radius-sm);

        color: var(--color-text-muted);
        text-decoration: none;

        transition: var(--transition);
      }

      .nav-link:hover {
        color: var(--color-primary);

        background: var(--color-primary-light);
      }

      /* =========================================
       LINKS
    ========================================= */

      .link {
        color: var(--color-primary);
        text-decoration: none;
        font-weight: 500;
      }

      .link:hover {
        text-decoration: underline;
      }

      .links-list {
        margin: 0;
        padding-left: var(--space-6);
      }

      .links-list li {
        margin-bottom: var(--space-2);
      }

      /* =========================================
       LISTS
    ========================================= */

      ul,
      ol {
        margin: 0 0 var(--space-4);
        padding-left: var(--space-6);
      }

      li {
        margin-bottom: var(--space-2);
      }

      /* =========================================
       CARDS
    ========================================= */

      .card {
        padding: var(--space-5);

        margin-bottom: var(--space-4);

        background: var(--color-surface);

        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);

        box-shadow: var(--shadow-sm);
      }

      .card--primary {
        border-color: var(--color-primary);
        background: var(--color-primary-light);
      }

      .card--success {
        border-left: 4px solid var(--color-success);
      }

      .card--warning {
        border-left: 4px solid var(--color-warning);
      }

      .card--danger {
        border-left: 4px solid var(--color-danger);
      }

      .card__title {
        margin-bottom: var(--space-2);
      }

      .cards-list {
        display: grid;

        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));

        gap: var(--space-4);

        margin-bottom: var(--space-6);
      }

      /* =========================================
       TAGS
    ========================================= */

      .tag {
        display: inline-flex;
        align-items: center;

        padding: 0.2rem 0.6rem;

        font-size: var(--font-size-xs);
        font-weight: 600;

        border-radius: 999px;

        color: var(--color-text-muted);
        background: var(--color-surface-alt);
      }

      .tag--primary {
        color: var(--color-primary);
        background: var(--color-primary-light);
      }

      .tag--success {
        color: var(--color-success);
        background: var(--color-success-light);
      }

      .tag--warning {
        color: var(--color-warning);
        background: var(--color-warning-light);
      }

      .tag--danger {
        color: var(--color-danger);
        background: var(--color-danger-light);
      }

      .tags-list,
      .badges-list {
        display: flex;
        flex-wrap: wrap;

        gap: var(--space-2);

        margin-bottom: var(--space-4);
      }

      /* =========================================
       BADGES
    ========================================= */

      .badge {
        display: inline-flex;
        align-items: center;

        padding: var(--space-1) var(--space-2);

        font-size: var(--font-size-xs);
        font-weight: 700;

        border-radius: var(--radius-sm);

        color: var(--color-text);
        background: var(--color-surface-alt);
      }

      .badge--primary {
        color: #ffffff;
        background: var(--color-primary);
      }

      .badge--success {
        color: #ffffff;
        background: var(--color-success);
      }

      .badge--warning {
        color: #ffffff;
        background: var(--color-warning);
      }

      .badge--danger {
        color: #ffffff;
        background: var(--color-danger);
      }

      /* =========================================
       BUTTONS
    ========================================= */

      .button {
        display: inline-flex;

        align-items: center;
        justify-content: center;

        padding: var(--space-2) var(--space-4);

        border: 1px solid transparent;
        border-radius: var(--radius-sm);

        cursor: pointer;

        font: inherit;
        font-weight: 600;

        transition: var(--transition);
      }

      .button--primary {
        color: #ffffff;
        background: var(--color-primary);
      }

      .button--primary:hover {
        background: var(--color-primary-hover);
      }

      .button--secondary {
        color: var(--color-text);

        background: var(--color-surface);

        border-color: var(--color-border);
      }

      .button--danger {
        color: #ffffff;
        background: var(--color-danger);
      }

      /* =========================================
       HIGHLIGHTS
    ========================================= */

      .highlight {
        padding: 0.1rem 0.3rem;

        border-radius: var(--radius-sm);

        background: var(--color-warning-light);
      }

      .highlight--primary {
        color: var(--color-primary);
        background: var(--color-primary-light);
      }

      /* =========================================
       SECTIONS
    ========================================= */

      .section {
        margin-bottom: var(--space-10);

        scroll-margin-top: var(--space-6);
      }

      .section--card {
        padding: var(--space-6);

        background: var(--color-surface);

        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
      }

      /* =========================================
       QUOTES
    ========================================= */

      .quote {
        margin: var(--space-5) 0;

        padding: var(--space-4) var(--space-5);

        border-left: 4px solid var(--color-primary);

        color: var(--color-text);
        background: var(--color-primary-light);
      }

      .quote__author {
        display: block;

        margin-top: var(--space-2);

        font-size: var(--font-size-sm);

        color: var(--color-text-muted);
      }

      /* =========================================
       INLINE CODE
    ========================================= */

      code {
        padding: 0.15rem 0.35rem;

        border-radius: var(--radius-sm);

        font-family: var(--font-mono);
        font-size: 0.9em;

        color: var(--color-danger);

        background: var(--color-surface-alt);
      }

      /* =========================================
       MULTILINE CODE
    ========================================= */

      .code-block {
        margin: var(--space-4) 0 var(--space-6);

        border-radius: var(--radius-md);

        overflow: hidden;

        background: var(--color-code-bg);
      }

      .code-block__header {
        display: flex;

        align-items: center;
        justify-content: space-between;

        padding: var(--space-2) var(--space-4);

        font-size: var(--font-size-xs);

        color: var(--color-text-muted);

        background: rgba(255, 255, 255, 0.05);
      }

      .code-block pre {
        margin: 0;

        padding: var(--space-5);

        overflow-x: auto;
      }

      .code-block code {
        padding: 0;

        color: var(--color-code-text);
        background: transparent;
      }

      /* =========================================
       TABLES
    ========================================= */

      .table-wrapper {
        width: 100%;

        margin-bottom: var(--space-6);

        overflow-x: auto;

        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
      }

      table {
        width: 100%;

        border-collapse: collapse;

        background: var(--color-surface);
      }

      th,
      td {
        padding: var(--space-3) var(--space-4);

        text-align: left;

        border-bottom: 1px solid var(--color-border);
      }

      th {
        font-size: var(--font-size-sm);
        font-weight: 700;

        background: var(--color-surface-alt);
      }

      tr:last-child td {
        border-bottom: 0;
      }

      /* =========================================
       FLOATING PANEL
    ========================================= */

      .floating-panel__title {
        margin-bottom: var(--space-3);

        font-size: var(--font-size-lg);
      }

      .floating-panel__text {
        margin-bottom: var(--space-4);

        font-size: var(--font-size-sm);

        color: var(--color-text-muted);
      }

      /* =========================================
       RESPONSIVE
    ========================================= */

      @media (max-width: 1200px) {
        .floating-panel {
          display: none;
        }

        .content {
          padding-right: 0;
        }
      }

      @media (max-width: 768px) {
        .left-panel {
          position: relative;

          width: 100%;
          height: auto;
        }

        .main {
          margin-left: 0;

          padding: var(--space-5);
        }
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <script>
      /* =========================================================
       UTILITIES
    ========================================================= */

      const escapeHtml = (value = "") =>
        String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");

      /**
       * Sort an array by a nested property path.
       *
       * @param {Array} data - Array to sort.
       * @param {string} path - Nested property path, e.g. 'item.commands'
       * @param {'asc'|'desc'} order - Sort direction.
       * @returns {Array} Sorted copy of the original array.
       */
      function deepSort(data, path, order = "asc") {
        const getValue = (obj, path) =>
          path.split(".").reduce((value, key) => value?.[key], obj);

        const direction = order.toLowerCase() === "desc" ? -1 : 1;

        return [...data].sort((a, b) => {
          const valueA = getValue(a, path);
          const valueB = getValue(b, path);

          // Handle null / undefined values
          if (valueA == null && valueB == null) return 0;
          if (valueA == null) return 1;
          if (valueB == null) return -1;

          // Numbers
          if (typeof valueA === "number" && typeof valueB === "number") {
            return (valueA - valueB) * direction;
          }

          // Strings and other comparable values
          return (
            String(valueA).localeCompare(String(valueB), undefined, {
              numeric: true,
              sensitivity: "base",
            }) * direction
          );
        });
      }
      /* =========================================================
       GENERIC RENDER FUNCTIONS
    ========================================================= */

      const renderHeading = ({
        level = 2,
        text = "",
        id = "",
        className = "",
      }) => {
        const safeLevel = Math.min(Math.max(level, 1), 6);

        return `
        <h${safeLevel}
          ${id ? `id="${escapeHtml(id)}"` : ""}
          class="${escapeHtml(className)}"
        >
          ${escapeHtml(text)}
        </h${safeLevel}>
      `;
      };

      const renderDivider = ({ variant = "default" } = {}) => `
      <hr
        class="
          divider
          divider--${escapeHtml(variant)}
        "
      />
    `;

      const renderLink = ({ label = "", href = "#", target = "" }) => `
      <a
        class="link"
        href="${escapeHtml(href)}"
        ${target ? `target="${escapeHtml(target)}"` : ""}
      >
        ${escapeHtml(label)}
      </a>
    `;

      const renderLinksList = (links = []) => `
      <ul class="links-list">
        ${links
          .map(
            (link) => `
            <li>
              ${renderLink(link)}
            </li>
          `,
          )
          .join("")}
      </ul>
    `;

      const renderCard = ({
        title = "",
        content = "",
        variant = "default",
      }) => `
      <article
        class="
          card
          card--${escapeHtml(variant)}
        "
      >
        ${
          title
            ? `
              <h3 class="card__title">
                ${escapeHtml(title)}
              </h3>
            `
            : ""
        }

        ${content ? `<p>${content}</p>` : ""}
      </article>
    `;

      const renderCardsList = (cards = []) => `
      <div class="cards-list">
        ${cards.map(renderCard).join("")}
      </div>
    `;

      const renderTable = ({ headers = [], rows = [] }) => `
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              ${headers
                .map(
                  (header) => `
                  <th>
                    ${escapeHtml(header)}
                  </th>
                `,
                )
                .join("")}
            </tr>
          </thead>

          <tbody>
            ${rows
              .map(
                (row) => `
                <tr>
                  ${row
                    .map(
                      (cell) => `
                      <td>${cell}</td>
                    `,
                    )
                    .join("")}
                </tr>
              `,
              )
              .join("")}
          </tbody>
        </table>
      </div>
    `;

      const renderSection = ({
        id = "",
        title = "",
        content = "",
        variant = "",
      }) => `
      <section
        id="${escapeHtml(id)}"
        class="
          section
          ${variant ? `section--${escapeHtml(variant)}` : ""}
        "
      >
        ${
          title
            ? renderHeading({
                level: 2,
                text: title,
              })
            : ""
        }

        ${content}
      </section>
    `;

      const renderInlineCode = (code = "") => `
      <code>
        ${escapeHtml(code)}
      </code>
    `;

      const renderCode = ({ code = "", language = "text" }) => `
      <div class="code-block">
        <div class="code-block__header">
          <span>
            ${escapeHtml(language)}
          </span>
        </div>

        <pre><code>${escapeHtml(code)}</code></pre>
      </div>
    `;

      /* Keeping requested function name */
      const renderQoute = ({ text = "", author = "" }) => `
      <blockquote class="quote">
        ${escapeHtml(text)}

        ${
          author
            ? `
              <span class="quote__author">
                — ${escapeHtml(author)}
              </span>
            `
            : ""
        }
      </blockquote>
    `;

      const renderTag = ({ label = "", variant = "default" }) => `
      <span
        class="
          tag
          tag--${escapeHtml(variant)}
        "
      >
        ${escapeHtml(label)}
      </span>
    `;

      const renderTagsList = (tags = []) => `
      <div class="tags-list">
        ${tags.map(renderTag).join("")}
      </div>
    `;

      const renderBadge = ({ label = "", variant = "default" }) => `
      <span
        class="
          badge
          badge--${escapeHtml(variant)}
        "
      >
        ${escapeHtml(label)}
      </span>
    `;

      const renderBadgesList = (badges = []) => `
      <div class="badges-list">
        ${badges.map(renderBadge).join("")}
      </div>
    `;

      /* =========================================================

      /* =========================================================

      const COMMANDS_DATA = [

      const renderLeftPanel = (groups = []) => `
      <aside class="left-panel">
        ${groups
          .map(
            (group) => `
            <div class="nav-group">

              <span class="nav-group__label">
                ${escapeHtml(group.label)}
              </span>

              <nav class="nav-links">
                ${group.links
                  .map(
                    (link) => `
                    <a
                      class="nav-link"
                      href="${escapeHtml(link.href)}"
                    >
                      ${escapeHtml(link.label)}
                    </a>
                  `,
                  )
                  .join("")}
              </nav>

            </div>
          `,
          )
          .join("")}
      </aside>
    `;

      const renderCommandSection = (commandGroup) => {
        const rows = deepSort(commandGroup.commands, "command").map((item) => [
          renderInlineCode(item.command),
          escapeHtml(item.description),
        ]);

        return renderSection({
          id: commandGroup.id,

          title: commandGroup.title,

          content: `
          <p>
            ${escapeHtml(commandGroup.description)}
          </p>

          ${renderTagsList(commandGroup.tags)}

          ${renderTable({
            headers: ["Command", "Description"],

            rows,
          })}
        `,
        });
      };

      const renderContent = (commands = []) => `
      <div class="content">

        ${renderHeading({
          level: 1,
          text: "Developer CLI Commands Reference",

        <p>
          A searchable-style reference structure for commonly used
          source control, cloud, infrastructure, container,
          JavaScript and Linux command-line tools.

          text: "New command groups can be added by updating the data constants without changing the rendering logic.",

        ${renderDivider({
          variant: "primary",
        })}

        ${commands.map(renderCommandSection).join("")}

      </div>
    `;

      const renderFloatingPanel = (data) => `
      <aside class="floating-panel">

        <h3 class="floating-panel__title">
          ${escapeHtml(data.title)}
        </h3>

        <p class="floating-panel__text">
          ${escapeHtml(data.text)}
        </p>

        ${renderBadgesList(data.badges)}

        <button
          class="
            button
            button--primary
          "
          onclick="
            window.scrollTo({
              top: 0,
              behavior: 'smooth'
            })
          "
        >
          Back to Top
        </button>

      </aside>
    `;

      const renderApp = () => {
        const app = document.getElementById("app");

        app.innerHTML = `
        <div class="app">

          ${renderLeftPanel(LEFT_PANEL_DATA)}

          <main class="main">
            ${renderContent(COMMANDS_DATA)}
          </main>

          ${renderFloatingPanel(FLOATING_PANEL_DATA)}

        </div>
      `;
      };

      /* =========================================================
       INITIALIZATION
    ========================================================= */

      document.addEventListener("DOMContentLoaded", () => {
        renderApp();
      });

      /* =========================================================
       EXTENSION EXAMPLE

       Add another tool by adding:

       1. A navigation entry to LEFT_PANEL_DATA
       2. A command object to COMMANDS_DATA

       Example:

       COMMANDS_DATA.push({
         id: 'commands-new-tool',

         title: 'New Tool',

         description:
           'Description of the tool.',

         tags: [
           {
             label: 'Category',
             variant: 'primary'
           }
         ],

         commands: [
           {
             command: 'tool command',
             description:
               'What the command does.'
           }
         ]
       });
    ========================================================= */
    </script>
  </body>
</html>
